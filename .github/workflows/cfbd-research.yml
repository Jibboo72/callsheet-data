name: CFBD research pull

# One-off, manual: downloads returning production / talent / recruiting /
# portal data from CollegeFootballData into research/cfbd/ for offline
# preseason-prior research. Not part of the regular build.
on:
  workflow_dispatch:
    inputs:
      first:
        description: "first season"
        default: "2017"
      last:
        description: "last season"
        default: "2026"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pull CFBD data
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: |
          pip install --quiet requests
          python fetch_cfbd_research.py "${{ github.event.inputs.first || '2017' }}" "${{ github.event.inputs.last || '2026' }}"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add research/cfbd
          git commit -m "CFBD research pull" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
