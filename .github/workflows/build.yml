name: Build receiver data

on:
  schedule:
    - cron: "0 11 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to build (blank = current)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandas
        run: pip install --quiet pandas

      - name: Work out which season to build
        id: season
        run: |
          if [ -n "${{ github.event.inputs.season }}" ]; then
            echo "season=${{ github.event.inputs.season }}" >> $GITHUB_OUTPUT
            echo "run=yes" >> $GITHUB_OUTPUT
            exit 0
          fi
          MONTH=$(date -u +%m)
          YEAR=$(date -u +%Y)
          if [ "$MONTH" -ge 09 ]; then
            echo "season=$YEAR" >> $GITHUB_OUTPUT
            echo "run=yes" >> $GITHUB_OUTPUT
          elif [ "$MONTH" -le 02 ]; then
            echo "season=$((YEAR-1))" >> $GITHUB_OUTPUT
            echo "run=yes" >> $GITHUB_OUTPUT
          else
            echo "run=no" >> $GITHUB_OUTPUT
            echo "Offseason - nothing to rebuild."
          fi

      - name: Build
        if: steps.season.outputs.run == 'yes'
        run: |
          mkdir -p data
          python build_receivers.py "${{ steps.season.outputs.season }}" \
            "data/receivers-${{ steps.season.outputs.season }}.json"

      - name: Commit if the numbers changed
        if: steps.season.outputs.run == 'yes'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No change this week."
          else
            git commit -m "Data through $(date -u +%Y-%m-%d)"
            git push
          fi
