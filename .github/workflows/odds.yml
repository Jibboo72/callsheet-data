name: Weekly odds pull

# Separate from the data build on purpose: this one spends API quota, so it
# should never fire as a side effect of rebuilding stats.
on:
  schedule:
    # Times are UTC, set for Eastern STANDARD time (Nov-Mar, UTC-5); in
    # summer each lands an hour later on the ET clock. Off the hour on
    # purpose: GitHub ran the top-of-the-hour versions 3-6 hours late.
    # No backup runs here -- every run spends SportsGameOdds credits.
    # Wednesday 5:13am ET -- books have posted the new week's lines and props.
    - cron: "13 10 * * 3"
    # Friday 2:53pm ET -- prices you can still act on before Sunday.
    - cron: "53 19 * * 5"
  workflow_dispatch:
    inputs:
      season:
        description: "Season"
        required: false
        default: "2026"
      leagues:
        description: "NFL only. College props are entered by hand — a college pull cost ~200 objects for markets we do not use."
        required: false
        default: "NFL"

permissions:
  contents: write

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull odds
        env:
          SGO_KEY: ${{ secrets.SGO_KEY }}
          SGO_LEAGUES: ${{ github.event.inputs.leagues || 'NFL' }}
        run: |
          if [ -z "$SGO_KEY" ]; then
            echo "SGO_KEY secret not set — add it under Settings > Secrets"
            exit 1
          fi
          mkdir -p data
          SEASON="${{ github.event.inputs.season || '2026' }}"
          python pull_odds.py "$SEASON" "data/odds-$SEASON.json"

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/odds-*.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Odds snapshot $(date -u +%Y-%m-%d\ %H:%M)"
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep $((i*7)); done
          fi
