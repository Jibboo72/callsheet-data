name: Weekly odds pull

# Separate from the data build on purpose: this one spends API quota, so it
# should never fire as a side effect of rebuilding stats.
on:
  schedule:
    # Wednesday 7am ET — books have posted the new week's lines and props.
    # Friday 6pm ET — prices you can still act on before Sunday, after a
    # week of line movement. Cron is UTC only: these are written for
    # EDT (UTC-4). When clocks fall back on Nov 1 they run an hour
    # earlier on the ET clock (6am / 5pm) — change to "0 12 * * 3" and
    # "0 23 * * 5" if you want 7am / 6pm to hold through winter.
    - cron: "0 11 * * 3"
    - cron: "0 22 * * 5"
  workflow_dispatch:
    inputs:
      season:
        description: "Season"
        required: false
        default: "2026"
      leagues:
        description: "NFL only. College props are entered by hand — a college pull cost ~200 objects for markets we do not use."
        required: false
        default: "NFL"

permissions:
  contents: write

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull odds
        env:
          SGO_KEY: ${{ secrets.SGO_KEY }}
          SGO_LEAGUES: ${{ github.event.inputs.leagues || 'NFL' }}
        run: |
          if [ -z "$SGO_KEY" ]; then
            echo "SGO_KEY secret not set — add it under Settings > Secrets"
            exit 1
          fi
          mkdir -p data
          SEASON="${{ github.event.inputs.season || '2026' }}"
          python pull_odds.py "$SEASON" "data/odds-$SEASON.json"

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/odds-*.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Odds snapshot $(date -u +%Y-%m-%d\ %H:%M)"
            git push
          fi
